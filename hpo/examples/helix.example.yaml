
# ---- Notice ----------------------------------------------------
# Fill all REQUIRED values before running the relevant entry point.
# Use absolute paths for external executables and AF3 model parameters.


# ---- Run config ------------------------------------------------
# Run directory: <workspace>/shs_hpo/<run_name>/
# Use a new name for a new experiment. Existing compatible trial 
# files can be reused; NePS search recovery is separate.
run_name: test-run
input: hpo/examples/example_input.csv # CSV file or directory of CSVs; one row per chain (id,chain_id,type,sequence,pairs); see example
workspace_name:                       # REQUIRED: Existing Helix workspace name for the run folder
controller_python:                    # REQUIRED for controller submission

# Slurm resource requests
controller:
  count: 2           # number of controllers to submit
  partition: gpu-single
  cpus: 2
  memory: 20G
  gres: gpu:A100:1
  time: '05:00:00'   # total wall time; the last 2 min are reserved for a clean stop (min. 7 min)

# Neps config
neps_python:   # REQUIRED only for NePS controller submission
# Configs each controller evaluates (NePS counts per controller). Leave it out
# to evaluate as many as fit into controller.time: a controller does not start
# a trial that cannot finish before the time limit.
evaluations: 400
optimizer:     # optional custom optimizer selection
ignore_errors: true # keep sampling when a trial fails; failures are reported
# Stop all controllers when too many trials fail (writes STOPPED.json).
# Optional; these are the defaults. max_rate: 1.0 disables the limit.
failures:
  min_trials: 25  # never stop before this many trials have finished
  max_rate: 0.20  # stop when more than this share of the window failed
  window: 50      # last N finished trials; null = all trials


# ---- Storage ---------------------------------------------------
# Logs and temporary tool files go to a per-trial scratch directory that is
# removed after each trial. Default: /dev/shm (RAM, private to the job and
# cleared at job end; counts towards controller.memory, exceeding it ends the
# job with OUT_OF_MEMORY). $TMPDIR is on GPFS on Helix, so it is not used.
# Failed trials embed their logs in failure_report.json; standalone trials
# also keep them in standalone_trial/logs/.
storage:
  scratch:   # optional absolute path; empty = /dev/shm
  # Which NePS configs keep their per-RNA archives (AF3 output, MSA, DSSR):
  # all        every config (default; for scientific runs)
  # trajectory only configs on NePS's best-config trajectory or among the
  #            keep_top_k lowest losses; the others keep trial_result.json.
  #            Pruned during the run; failed trials are always kept.
  # After a run, `python -m hpo.export_results --config <yaml> --prune [--dry-run]`
  # applies the trajectory rule exactly, also to an `all` run.
  keep_artifacts: all
  keep_top_k: 5


# ---- Generator config ------------------------------------------
# One SHS generator per chain type (rna, protein). Each dataset chain uses the
# generator of its `type` column.
#
# IMPORTANT: only ONE generator is optimized per run. Searching the RNA and the
# protein generator together would need far too many hyperparameters, so
# `optimize` names the generator whose `search` space NePS samples. Every other
# generator runs with its `fixed` values (or generator defaults) and its `search`
# section is ignored with a warning. To tune the protein generator instead, set
# `optimize: protein`; it then needs its own `search` section.
#
# NePS: combine sampled search values with fixed values.
# Standalone: ignore search with a warning; use fixed values.
# Both modes: use generator defaults for parameters not supplied.
optimize: rna  # rna | protein
generators:
  rna:
    python:    # REQUIRED for RNA chains: SHS-Generator-RNA Python executable
    search:
      N: {type: integer, lower: 2, upper: 128, log: true}
      mutation_rate_unpaired: {type: float, lower: 0.0, upper: 1.0}
      mutation_rate_paired: {type: float, lower: 0.0, upper: 1.0}
      pair_mutation_approach:
        type: categorical
        choices: [covariance, watson_crick, watson_crick_cov, none]
    fixed:
      stem_single_insertion_prob: 0.0
      stem_long_insertion_prob: 0.0
      stem_single_deletion_prob: 0.0
      stem_pair_deletion_prob: 0.0
      loop_single_insertion_prob: 0.0
      loop_long_insertion_prob: 0.0
      loop_single_deletion_prob: 0.0
      loop_long_deletion_prob: 0.0
  protein:
    python:    # REQUIRED for protein chains: SHS-Generator-Protein Python executable
    # Not optimized in this config (optimize: rna). Move these values to `fixed`
    # entries or keep as the search space for `optimize: protein`. The protein
    # generator only knows pair_mutation_approach in [covariance, none] and has
    # no wobble_prob / pair_weight_* parameters.
    search:
      N: {type: integer, lower: 2, upper: 128, log: true}
      mutation_rate_unpaired: {type: float, lower: 0.0, upper: 1.0}
      mutation_rate_paired: {type: float, lower: 0.0, upper: 1.0}
      pair_mutation_approach:
        type: categorical
        choices: [covariance, none]
    fixed:
      stem_single_insertion_prob: 0.0
      stem_long_insertion_prob: 0.0
      stem_single_deletion_prob: 0.0
      stem_pair_deletion_prob: 0.0
      loop_single_insertion_prob: 0.0
      loop_long_insertion_prob: 0.0
      loop_single_deletion_prob: 0.0
      loop_long_deletion_prob: 0.0
# Standalone only, optional: several named trials in one job (one AF3 worker),
# each in trials/<name>/. parameters go over the optimized generator's fixed values; shs_seed/af3_seed default
# to the run's. Other keys (e.g. base) are kept for analysis. Trials may be
# added to an existing run; finished trials are not rerun.
# trials:
#   - {name: best_s1, base: 412, shs_seed: 1, af3_seed: 1, parameters: {N: 64}}
#   - {name: nomsa_s1, shs_seed: 1, af3_seed: 1, parameters: {N: 1}}
shs_seed: 42
generator_timeout_seconds: 600 # Per input-generation process


# ---- AF3 config ------------------------------------------------
module: bio/alphafold/3.0.1
model_dir:                  # REQUIRED: AF3 model parameters directory
af3_timeout_seconds: 9000  # per RNA; one AF3 worker per controller predicts all trials
af3_seed: 42
# Optional token sizes AF3 pads its inputs to (default: AF3's own, from 256).
# Smaller buckets make short RNAs much faster (36 nt: 8.4 s -> 3.1 s on an
# A100) but change the predictions like a different seed; each bucket used by
# the dataset is compiled once per controller (~25 s). Longer inputs than
# the last bucket get a bucket of exactly their size, compiled for every new length.
af3_buckets: [64, 128, 256, 512, 768, 1024, 1280, 1536, 2048, 2560, 3072, 3584, 4096, 4608, 5120]


# ---- Extraction config -----------------------------------------
# Turns each predicted model into a pair list: RNA -> DSSR base pairs,
# protein -> Biopython contacts (needs biopython + numpy in the controller env).
extraction:
  dssr:                     # REQUIRED for RNA chains: DSSR executable
  dssr_timeout_seconds: 300 # Per DSSR invocation
  protein:                  # Optional; shown values are the defaults
    atom: CA                # Atom used as residue position
    cutoff: 8.0             # Contact if distance <= cutoff (Angstrom)
    min_separation: 6       # Ignore pairs closer than this in sequence


# ---- scoring config -----------------------------------------------
scoring_objective: f1     # Optional; Options: f1 (f1 score, default), f1_soft (f1 with partial credit for slipped pairs), wl (weisfeiler-lehman graph kernel)
wl_iterations: 5          # Optional
