
# ---- Notice ----------------------------------------------------
# Fill all REQUIRED values before running the relevant entry point.
# Use absolute paths for external executables and AF3 model parameters.


# ---- Run config ------------------------------------------------
# Run directory: <workspace>/shs_hpo/<run_name>/
# Use a new name for a new experiment. Existing compatible trial 
# files can be reused; NePS search recovery is separate.
run_name: test-run
input: hpo/examples/example_input.csv # CSV file or directory of CSVs; see example for format
workspace_name:                       # REQUIRED: Existing Helix workspace name for the run folder
controller_python:                    # REQUIRED for controller submission

# Slurm resource requests
controller:
  count: 4           # number of controllers to submit
  partition: gpu-single
  cpus: 1
  memory: 20G
  gres: gpu:A100:1
  time: '24:00:00'   # total wall time; the last 2 min are reserved for a clean stop (min. 7 min)

# Neps config
neps_python:   # REQUIRED only for NePS controller submission
evaluations: 2 # Max number of configs neps will try
optimizer:     # optional custom optimizer selection
ignore_errors: true # keep sampling when a trial fails; failures are reported
# Stop all controllers when too many trials fail (writes STOPPED.json).
# Optional; these are the defaults. max_rate: 1.0 disables the limit.
failures:
  min_trials: 5   # never stop before this many trials have finished
  max_rate: 0.20  # stop when more than this share of the window failed
  window: 50      # last N finished trials; null = all trials


# ---- Storage ---------------------------------------------------
# Logs and temporary tool files go to a per-trial scratch directory that is
# removed after each trial. Default: /dev/shm (RAM, private to the job and
# cleared at job end; counts towards controller.memory, exceeding it ends the
# job with OUT_OF_MEMORY). $TMPDIR is on GPFS on Helix, so it is not used.
# Failed trials embed their logs in failure_report.json; standalone trials
# also keep them in standalone_trial/logs/.
storage:
  scratch:   # optional absolute path; empty = /dev/shm


# ---- Generator config ------------------------------------------
shs_python: # REQUIRED: SHS Python executable
# NePS: combine sampled search values with fixed values.
# Standalone: ignore search with a warning; use fixed values.
# Both modes: use generator defaults for parameters not supplied.
search:
  N: {type: integer, lower: 2, upper: 128, log: true}
  mutation_rate_unpaired: {type: float, lower: 0.0, upper: 1.0}
  mutation_rate_paired: {type: float, lower: 0.0, upper: 1.0}
  pair_mutation_approach:
    type: categorical
    choices: [covariance, watson_crick, watson_crick_cov, none]
fixed:
  stem_single_insertion_prob: 0.0
  stem_long_insertion_prob: 0.0
  stem_single_deletion_prob: 0.0
  stem_pair_deletion_prob: 0.0
  loop_single_insertion_prob: 0.0
  loop_long_insertion_prob: 0.0
  loop_single_deletion_prob: 0.0
  loop_long_deletion_prob: 0.0
shs_seed: 42
generator_timeout_seconds: 600 # Per RNA input-generation process


# ---- AF3 config ------------------------------------------------
module: bio/alphafold/3.0.1
model_dir:                  # REQUIRED: AF3 model parameters directory
af3_timeout_seconds: 9000  # per RNA; one AF3 process predicts all RNAs of a trial
af3_seed: 42


# ---- DSSR config -----------------------------------------------
dssr:                     # REQUIRED: DSSR executable
dssr_timeout_seconds: 300 # Per DSSR invocation


# ---- scoring config -----------------------------------------------
scoring_objective: f1     # Optional; Options: f1 (f1 score, default), wl (weisfeiler-lehman graph kernel) 
wl_iterations: 5          # Optional
