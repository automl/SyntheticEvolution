# Search over all RNA generator parameters. Paste this `search` block under
# `generators.rna` in your config (indent it) and set `optimize: rna`.
# Only one generator is optimized per run; the protein generator has fewer
# parameters (no wobble_prob or pair_wc_prob / pair_wobble_prob, pair_mutation_approach only
# covariance or none).
search:
  N: {type: integer, lower: 2, upper: 512, log: true}
  mutation_rate_paired:   {type: float, lower: 0.0, upper: 1.0}
  mutation_rate_unpaired: {type: float, lower: 0.0, upper: 1.0}
  pair_mutation_approach:
    type: categorical
    choices: [covariance, watson_crick, watson_crick_cov, original, none]
  stem_single_insertion_prob: {type: float, lower: 0.0, upper: 1.0}
  stem_long_insertion_prob:   {type: float, lower: 0.0, upper: 1.0}
  stem_single_deletion_prob:  {type: float, lower: 0.0, upper: 1.0}
  stem_pair_deletion_prob:    {type: float, lower: 0.0, upper: 1.0}
  loop_single_insertion_prob: {type: float, lower: 0.0, upper: 1.0}
  loop_long_insertion_prob:   {type: float, lower: 0.0, upper: 1.0}
  loop_single_deletion_prob:  {type: float, lower: 0.0, upper: 1.0}
  loop_long_deletion_prob:    {type: float, lower: 0.0, upper: 1.0}
  # Replacement base given the mutated partner (watson_crick / watson_crick_cov):
  # canonical with pair_wc_prob; for G/U partners, wobble share pair_wobble_prob.
  pair_wc_prob:     {type: float, lower: 0.0, upper: 1.0}
  pair_wobble_prob: {type: float, lower: 0.0, upper: 1.0}
  # Only read by the `original` approach.
  wobble_prob:                 {type: float, lower: 0.0, upper: 1.0}
  loop_max_insertion_fraction: {type: float, lower: 0.0, upper: 1.0}
  loop_max_deletion_fraction:  {type: float, lower: 0.0, upper: 1.0}
  stem_max_insertion_fraction: {type: float, lower: 0.0, upper: 1.0}
