
# ---- Notice ----------------------------------------------------
# Fill all REQUIRED values before running the relevant entry point.
# Use absolute paths for external executables and AF3 model parameters.


# ---- Run config ------------------------------------------------
# Run directory: <workspace>/shs_hpo/<run_name>/
# Use a new name for a new experiment. Existing compatible trial 
# files can be reused; NePS search recovery is separate.
run_name: neps-full 
input:              # REQUIRED
workspace_name:     # REQUIRED
controller_python:  # REQUIRED


# ---- Neps config -----------------------------------------------
neps_python:        # REQUIRED
evaluations: 2 # Max number of configs neps will try
optimizer: bayesian_optimization


# ---- Generator config ------------------------------------------
shs_python:         # REQUIRED
search:
  N:
    type: integer
    lower: 2
    upper: 512
    log: true
  mutation_rate_paired:
    type: float
    lower: 0.0
    upper: 1.0
  mutation_rate_unpaired:
    type: float
    lower: 0.0
    upper: 1.0
  pair_mutation_approach:
    type: categorical
    choices:
      - watson_crick_cov
      - watson_crick
      - covariance
      - original
      - none
  stem_single_insertion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  stem_long_insertion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  stem_single_deletion_prob:
    type: float
    lower: 0.0
    upper: 0.49
  stem_pair_deletion_prob:
    type: float
    lower: 0.0
    upper: 0.49
  loop_single_insertion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  loop_long_insertion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  loop_single_deletion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  loop_long_deletion_prob:
    type: float
    lower: 0.0
    upper: 1.0
  wobble_prob:
    type: float
    lower: 0.0
    upper: 1.0
  max_insertion_fraction:
    type: float
    lower: 0.0
    upper: 1.0
  max_deletion_fraction:
    type: float
    lower: 0.0
    upper: 1.0

fixed: {}
shs_seed: 42
generator_timeout_seconds: 600 # Per RNA input-generation process


# ---- AF3 config ------------------------------------------------
module: bio/alphafold/3.0.1
model_dir:                  # REQUIRED
poll_seconds: 30            # Interval between AF3 job-status checks
wait_timeout_seconds: 14000 # Maximum controller wait for an AF3 array
af3_seed: 42


# ---- DSSR config -----------------------------------------------
dssr:                       # REQUIRED
dssr_timeout_seconds: 300 # Per DSSR invocation


# ---- Slurm resource requests ------------------------------------
# CPU controller; remains allocated while waiting for AF3 jobs.
controller:
  partition: cpu-single
  cpus: 1
  memory: 4G
  time: '04:00:00' # Total controller wall time, including all trials and waits

# Resources per AF3 array task, one task per RNA.
gpu:
  partition: gpu-single
  cpus: 8
  memory: 20G
  gres: gpu:A100:1
  time: '00:15:00' # Wall time per AF3 task
  concurrency: 2   # Maximum simultaneously running tasks in each array
